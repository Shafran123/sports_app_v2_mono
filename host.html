<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Example</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
      }

      .container {
        max-width: 800px;
        margin: 60px auto;
        padding: 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        color: #1d4ed8;
      }

      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, HTML!</h1>
      <p>This is a simple HTML page created in the editor.</p>
      <button type="button">Click me</button>
    </div>
    <iframe
      src="http://localhost:3000/embed/c5c5212a17a5b6e6942d01b6501a4613"
      width="100%"
      height="720"
      style="border:0;border-radius:16px"
      loading="lazy"
      title="Book at Lanka Cricket Nets"
    ></iframe>
  </body>
</html>
